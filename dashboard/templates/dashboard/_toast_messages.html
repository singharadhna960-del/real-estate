<style>
    .dashboard-toast-stack {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 300px;
        max-width: calc(100vw - 32px);
        pointer-events: none;
    }

    .dashboard-toast {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        background: #fff;
        border-left: 4px solid #16a34a;
        border-radius: 8px;
        box-shadow: 0 5px 18px rgba(15, 23, 42, 0.18);
        color: #111827;
        font: 13px/1.4 "Segoe UI", sans-serif;
        pointer-events: auto;
        animation: dashboard-toast-display 4s ease forwards;
    }

    .dashboard-toast-icon {
        display: flex;
        flex: 0 0 25px;
        width: 25px;
        height: 25px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #16a34a;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
    }

    .dashboard-toast-error {
        border-left-color: #dc2626;
    }

    .dashboard-toast-error .dashboard-toast-icon {
        background: #dc2626;
    }

    .dashboard-toast-warning {
        border-left-color: #f59e0b;
    }

    .dashboard-toast-warning .dashboard-toast-icon {
        background: #f59e0b;
    }

    @keyframes dashboard-toast-display {
        0% { opacity: 0; transform: translateX(18px); }
        10%, 82% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(18px); }
    }
</style>

{% if messages %}
<div class="dashboard-toast-stack" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
        <div class="dashboard-toast dashboard-toast-{{ message.tags|default:'success' }}">
            <span class="dashboard-toast-icon" aria-hidden="true">
                {% if 'error' in message.tags %}×{% elif 'warning' in message.tags %}!{% else %}✓{% endif %}
            </span>
            <span>{{ message }}</span>
        </div>
    {% endfor %}
</div>
{% endif %}
